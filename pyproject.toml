[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svgpages"
version = "0.1.0"
description = "Vector-true multi-page PDF export for Inkscape Pages documents with linked SVG figures"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lxml>=4.9",
    "pikepdf>=8",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
svgpages = "svgpages.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["svgpages"]
