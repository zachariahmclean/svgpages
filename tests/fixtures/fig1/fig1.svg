<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="60mm" height="40mm" viewBox="0 0 60 40">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d55e00"/>
      <stop offset="1" stop-color="#e69f00"/>
    </linearGradient>
    <clipPath id="clip"><rect x="0" y="0" width="60" height="40"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect x="2" y="2" width="56" height="36" fill="url(#grad)"/>
    <circle id="dot" cx="15" cy="16" r="4" fill="#0072b2"/>
    <use xlink:href="#dot" x="30"/>
    <text x="30" y="36" font-size="4" text-anchor="middle">fig1 (warm gradient)</text>
  </g>
</svg>
