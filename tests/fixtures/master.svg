<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="180mm" height="130mm" viewBox="0 0 180 130">
  <sodipodi:namedview>
    <inkscape:page x="0" y="0" width="180" height="130" id="page1" inkscape:label="Figure 1"/>
    <inkscape:page x="190" y="0" width="90" height="60" id="page2" inkscape:label="Figure 2"/>
  </sodipodi:namedview>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#999999"/>
      <stop offset="1" stop-color="#eeeeee"/>
    </linearGradient>
  </defs>
  <rect x="110" y="10" width="60" height="40" fill="url(#grad)" stroke="#000000" stroke-width="0.5"/>
  <image x="10" y="10" width="60" height="40" xlink:href="fig1/fig1.svg"/>
  <image id="placed-fig2" x="10" y="60" width="60" height="40" xlink:href="fig2/fig2.svg" transform="rotate(-3 40 80)"/>
  <text x="10" y="120" font-size="6">master native text</text>
  <text x="195" y="15" font-size="6">page two</text>
  <rect x="195" y="20" width="80" height="30" fill="none" stroke="#0072b2" stroke-width="1"/>
</svg>
